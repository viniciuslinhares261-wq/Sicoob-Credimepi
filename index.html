<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão de Mídias · Sicoob Credimepi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Asap:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f7f7;--panel:#fff;--ink:#003641;--muted:#5b7177;--line:#dde7e8;--soft:#edf4f4;
  --accent:#00AE9D;--dark:#003641;--lime:#C9D200;--mid:#7DB61C;--purple:#49479D;--accent-ink:#fff;--ok:#15803d;--warn:#c2410c;--bad:#b91c1c;
  --c-outdoor:#00AE9D;--c-radio:#49479D;--c-instagram:#7DB61C;--c-linkedin:#00708A;--c-facebook:#8C8AD6;
  --r:10px;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Asap,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:flex;min-height:100vh}
/* Sidebar */
.side{width:240px;flex:none;background:var(--dark);color:#cfe3e2;padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:6px 10px 16px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:8px}
.logoimg{width:176px;height:auto;display:block}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--lime);letter-spacing:.02em}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;font-size:15px;font-weight:700;color:#fff;flex:none}
.navsec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#7fa3a6;padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:#cfe3e2;text-decoration:none;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.nav:hover{background:rgba(255,255,255,.07);color:#fff}
.nav.on{background:var(--accent);color:#fff;font-weight:600}
.nav.on .dot{box-shadow:0 0 0 2px #fff}
.nav .dot{width:8px;height:8px;border-radius:50%;flex:none}
.nav .ic{width:18px;text-align:center;opacity:.85;flex:none}
.nav .badge{margin-left:auto;background:#dc2626;color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:600}
main{flex:1;min-width:0;padding:22px 28px 60px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.top h1{margin:0;font-size:24px;letter-spacing:-.01em;color:var(--dark)}
.top h1::after{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--lime);margin-top:6px}
.top p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* Controls */
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.inp,select.inp,textarea.inp{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;width:100%;outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,174,157,.18)}
textarea.inp{min-height:84px;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-weight:500}
.seg button.on{background:var(--dark);color:#fff}
/* Cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);gap:10px}
.card-h h3{margin:0;font-size:15px}
.card-b{padding:14px 16px}
.grid{display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi .l{color:var(--muted);font-size:12.5px}
.kpi{border-left:4px solid var(--accent)}
.kpi .v{color:var(--dark);font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .s{color:var(--muted);font-size:12px;margin-top:2px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.two>*,.grid>*{min-width:0}
.menubtn{display:none}
.empty{color:var(--muted);text-align:center;padding:26px 12px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
/* Table */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;color:var(--dark);font-weight:700;padding:10px 12px;border-bottom:2px solid var(--accent);background:#f4f9f9;white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:#fafbfd}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th.num{text-align:right}
.tblwrap{overflow:auto}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--soft);color:var(--muted)}
.pill.ativo{background:#dff5f2;color:#00695f}
.pill.alerta{background:#ffedd5;color:#9a3412}
.pill.agendado{background:#e6e6f6;color:#49479D}
.pill.encerrado{background:#f1f5f9;color:#64748b}
.pill.rascunho{background:#f1f5f9;color:#475569}
.pill.publicado{background:#eef6d9;color:#4d7a0a}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px}
.tag i{width:8px;height:8px;border-radius:50%;display:inline-block}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.toolbar .inp{width:auto;min-width:220px}
/* Calendar */
.calbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.calbar h2{margin:0 6px;font-size:17px;min-width:170px;text-transform:capitalize}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:#fbfbfc}
.fchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;cursor:pointer;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.fchip i{width:8px;height:8px;border-radius:50%}
.fchip.off{opacity:.45;text-decoration:line-through}
.filters .inp{width:auto;padding:5px 8px;font-size:13px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
.dow div{padding:8px 10px;font-size:12px;color:var(--muted);font-weight:600}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cell{min-height:118px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:3px}
.cell:nth-child(7n){border-right:0}
.cell:hover{background:#f2faf9}
.cell.out{background:#fafbfc}
.cell.out .dn{color:#a3a9b6}
.cell-h{display:flex;align-items:center;justify-content:space-between}
.dn{font-size:12.5px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cell.today .dn{background:var(--accent);color:#fff}
.cell .add{opacity:0;border:0;background:var(--accent);color:#fff;width:22px;height:22px;border-radius:6px;cursor:pointer;font-size:15px;line-height:1}
.cell:hover .add{opacity:1}
.chip{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 11%,#fff);color:#1f2430;border-radius:4px;padding:2px 6px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;text-decoration:none}
.chip:hover{background:color-mix(in srgb,var(--c) 20%,#fff)}
.chip.sync{border-left-style:dashed}
.more{font-size:11.5px;color:var(--muted);padding:0 4px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wcol{border-right:1px solid var(--line);min-height:420px;padding:8px;display:flex;flex-direction:column;gap:5px;cursor:pointer}
.wcol:last-child{border-right:0}
.wcol:hover{background:#f2faf9}
.wcol .wh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.wcol .wh b{font-size:13px}
.wcol.today .wh b{color:var(--accent)}
.wcol .chip{white-space:normal;padding:5px 7px;font-size:12px}
.chip small{display:block;color:var(--muted);font-size:11px}
/* Drawer & modal */
.ov{position:fixed;inset:0;background:rgba(0,54,65,.45);z-index:40;display:flex;justify-content:flex-end}
.drawer{width:min(440px,100%);background:#fff;height:100%;overflow:auto;box-shadow:-10px 0 30px rgba(0,0,0,.12);display:flex;flex-direction:column}
.drawer .dh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.drawer .dh h3{margin:0;font-size:17px;text-transform:capitalize}
.drawer .db{padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.addgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.addbtn{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.addbtn:hover{border-color:var(--c);background:color-mix(in srgb,var(--c) 7%,#fff)}
.addbtn i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.item{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:9px 11px;cursor:pointer;display:block;text-decoration:none;color:inherit}
.item:hover{background:#fafbfd}
.item b{display:block;font-size:13.5px}
.item span{font-size:12.5px;color:var(--muted)}
.x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:0 4px}
.mov{position:fixed;inset:0;background:rgba(0,54,65,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:#fff;border-radius:14px;width:min(760px,100%);box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal.sm{width:min(420px,100%)}
.mh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.mh h3{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}
.mb{padding:18px 22px}
.mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.mf .sp{flex:1}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:12.5px;font-weight:600;color:#3a4150}
.f .help{font-size:11.5px;color:var(--muted)}
.fsec{grid-column:1/-1;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;border-top:1px solid var(--line);padding-top:12px;margin-top:2px}
.form>.fsec:first-child{border-top:0;padding-top:0;margin-top:0}
.files{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.file{border:1px solid var(--line);border-radius:8px;padding:4px;display:flex;align-items:center;gap:6px;font-size:12px;max-width:100%;background:#fafbfc}
.file img{width:52px;height:52px;object-fit:cover;border-radius:5px}
.file audio{height:32px;max-width:220px}
.file .rm{border:0;background:none;cursor:pointer;color:var(--bad);font-size:16px}
.file a{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist{grid-column:1/-1;background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.hist h4{margin:0 0 8px;font-size:13px}
.hist .hrow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px dashed var(--line);font-size:12.5px}
.hist .hrow:first-of-type{border-top:0}
/* Bars */
.bars{display:flex;flex-direction:column;gap:12px}
.bar .bl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;gap:8px}
.bar .bl b{font-variant-numeric:tabular-nums}
.bar .track{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;position:relative}
.bar .fill{height:100%;border-radius:999px}
.bar .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:#111}
/* Campaign cards */
.camps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.camp{padding:16px;border-top:4px solid var(--c);cursor:pointer}
.camp:hover{box-shadow:0 4px 14px rgba(16,24,40,.08)}
.camp h3{margin:0 0 4px;font-size:16px}
.camp .meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--muted)}
.thumbs{display:flex;gap:6px;margin-top:10px}
.thumbs img{width:44px;height:44px;border-radius:6px;object-fit:cover;border:1px solid var(--line)}
/* Posts */
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;padding:16px}
.post{overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.post:hover{box-shadow:0 4px 14px rgba(16,24,40,.1)}
.post .media{aspect-ratio:1/1;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,#fff),color-mix(in srgb,var(--c) 6%,#fff));display:grid;place-items:center;color:var(--c);font-weight:700;font-size:13px;overflow:hidden}
.post .media img,.post .media video{width:100%;height:100%;object-fit:cover}
.post .pb{padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.post .cap{font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.post .pm{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
/* Social */
.accs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px}
.acc{padding:16px;border-top:4px solid var(--c)}
.acc .ah{display:flex;align-items:center;gap:10px}
.acc .av{width:38px;height:38px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700}
.acc .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.acc .stats div{background:var(--soft);border-radius:8px;padding:8px}
.acc .stats b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.acc .stats span{font-size:11.5px;color:var(--muted)}
.note{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start}
.note.warn{background:#fff7ed;border-color:#fed7aa}
.note.err{background:#fef2f2;border-color:#fecaca}
.note.info{background:#e9f8f6;border-color:#a8e3dc}
.alist{display:flex;flex-direction:column}
.arow{display:flex;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);cursor:pointer}
.arow:first-child{border-top:0}
.arow:hover{background:#fafbfd}
.arow .ti{flex:1;min-width:0}
.arow .ti b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .ti span{font-size:12px;color:var(--muted)}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
#printRoot{display:none}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:var(--dark);color:#fff;padding:10px 16px;border-radius:9px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* Mapa de atuação */
.mapgrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;align-items:start}
.mapcard{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.mapcard .mh2{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap}
.mapcard .mh2 b{font-size:15px}
.mapsvg{display:block;width:100%;height:auto;background:#eaf3f6}
.mapsvg .mu{stroke:#cfdcdd;stroke-width:.4;cursor:pointer;transition:fill .15s}
.mapsvg .mu:hover{stroke:var(--dark);stroke-width:1}
.mapsvg .mu.sel{stroke:var(--dark);stroke-width:1.6}
.mapsvg .uf{fill:none;stroke:var(--dark);stroke-width:1.4;pointer-events:none}
.mapsvg .mk{cursor:pointer}
.mapsvg .mk:hover circle,.mapsvg .mk:hover rect{stroke-width:2.2}
.maplegend{display:flex;flex-wrap:wrap;gap:10px;padding:8px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.maplegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.maplegend i.sq{border-radius:2px}
.sbar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--soft)}
.sbar i{display:block;height:100%}
.crow{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12.5px;padding:5px 0;cursor:pointer}
.crow:hover{background:#f7fbfb}
.crow.sel{font-weight:700}
.crow span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow b{font-variant-numeric:tabular-nums}
.ufchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:13px}
.ufchip.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.mitem{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);cursor:pointer;font-size:12.5px}
.mitem:first-child{border-top:0}
.mitem i{width:10px;height:10px;border-radius:50%;flex:none;margin-top:4px}
.mitem span{color:var(--muted);display:block;font-size:11.5px}
@media (max-width:900px){.mapgrid{grid-template-columns:minmax(0,1fr)}}
/* Placa */
.placa-wrap{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:16px;align-items:start}
.placa-ctl{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.placa-ctl .f label{font-size:12px}
.placa-prev{position:sticky;top:12px;background:#dfe7e8;border-radius:12px;padding:18px;display:flex;justify-content:center;align-items:center;min-height:300px}
.placa-prev svg{width:100%;height:auto;max-height:78vh;box-shadow:0 8px 30px rgba(0,0,0,.25);background:#fff}
.segw{display:flex;flex-wrap:wrap;gap:6px}
.segw button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer;font-weight:600;font-size:13px;flex:1 1 auto}
.segw button.on{background:var(--dark);color:#fff;border-color:var(--dark)}
@media (max-width:900px){.placa-wrap{grid-template-columns:minmax(0,1fr)}}
/* Jornadas */
.jsel{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.jsel button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.jsel button i{width:10px;height:10px;border-radius:50%;background:var(--j)}
.jsel button.on{background:var(--j);color:#fff;border-color:var(--j)}
.jsel button.on i{background:#fff}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px;align-items:start}
.jgrp{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 4px 2px;border-bottom:1px solid #d5e3e3}

.ccnums span{font-size:1.15cqw;opacity:.9}
.ogrid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1.6cqw;flex:1;min-height:0}
.ocard{display:grid;grid-template-columns:40% 1fr;border:.12cqw solid var(--line);border-radius:1.2cqw;overflow:hidden;min-height:0;background:#fff}

.ocard .oimg .ph{font-size:5cqw;color:var(--c)}

.ocard .bb{width:88%;position:relative;margin-bottom:3cqw}
.ocard .bb img{width:100%;height:auto;display:block;border:.35cqw solid #263238;border-radius:.3cqw;box-shadow:0 .4cqw .8cqw rgba(0,0,0,.2)}
.ocard .bb::after{content:"";position:absolute;left:22%;right:22%;top:100%;height:3.2cqw;background:linear-gradient(90deg,#455a64 0 9%,transparent 9% 91%,#455a64 91%)}

.ocard .otag{position:absolute;right:.8cqw;top:.8cqw;background:var(--c);color:#fff;font-size:1cqw;font-weight:700;padding:.3cqw .8cqw;border-radius:2cqw}
.ocard .ob{padding:1.2cqw 1.4cqw;display:flex;flex-direction:column;gap:.5cqw;min-width:0;overflow:hidden}

.ocard .ob small,.ocard dl{flex:none}
.ocard .ob small{font-size:1.05cqw;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ocard dl{margin:.4cqw 0 0;display:grid;grid-template-columns:auto 1fr;gap:.45cqw 1cqw;font-size:1.08cqw;line-height:1.3}
.ocard dt{color:var(--muted);font-weight:700;text-transform:uppercase;font-size:.9cqw;letter-spacing:.05em;padding-top:.15cqw}
.ocard dd{margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ocard .canal{display:inline-flex;gap:.5cqw;align-items:center}
.ocard .canal i{width:.9cqw;height:.9cqw;border-radius:50%;background:var(--c)}
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4cqw}
.rgrid div{background:var(--soft);border-radius:1.2cqw;padding:1.6cqw}

.rbars .t i{display:block;height:100%;border-radius:1cqw}
.exnote{font-size:12px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:999px;padding:3px 10px}

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const p=String(s).slice(0,10).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d);};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const fmtD=s=>s?String(s).slice(0,10).split('-').reverse().join('/'):'—';
const fmtDT=s=>s?fmtD(s)+(String(s).length>10?' '+String(s).slice(11,16):''):'—';
const money=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=n=>(Number(n)||0).toLocaleString('pt-BR');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const URLS={};
const blobUrl=id=>String(id).startsWith('data:')?id:(MODO==='supabase'?(URLS[id]||''):'/_blob/'+encodeURIComponent(id));
const clone=o=>JSON.parse(JSON.stringify(o||{}));
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DOW=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DOWL=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const ALERTA_OUTDOOR=3, ALERTA_RADIO=15;

const TIPOS={
  outdoor:{label:'Outdoor',cor:'var(--c-outdoor)',hex:'#00AE9D',col:'outdoors'},
  radio:{label:'Rádio',cor:'var(--c-radio)',hex:'#49479D',col:'radios'},
  instagram:{label:'Instagram',cor:'var(--c-instagram)',hex:'#7DB61C',col:'posts'},
  linkedin:{label:'LinkedIn',cor:'var(--c-linkedin)',hex:'#00708A',col:'posts'},
  facebook:{label:'Facebook',cor:'var(--c-facebook)',hex:'#8C8AD6',col:'posts'}
};

    await db.collection(col).doc(id).set(body);

    const arr=S.data[col]; const i=arr.findIndex(x=>x.id===id);
    const obj=hidratar(Object.assign({id},body));
    if(i>=0) arr[i]=obj; else arr.push(obj);
    agendarRender();
  }
  return id;
}
async function excluir(col,id){
  if(MODO==='supabase'){ const {error}=await sb.from('registros').delete().eq('colecao',col).eq('id',id); if(error) throw {code:'sb',message:error.message}; S.data[col]=S.data[col].filter(x=>x.id!==id); agendarRender(); }
  else if(db){ await db.collection(col).doc(id).delete(); }
  else{ S.data[col]=S.data[col].filter(x=>x.id!==id); agendarRender(); }
}
function erroGravar(e){
  const c=e&&e.code;
  if(c==='invalid_argument') toast('Não foi possível salvar: você não tem permissão de edição ou o registro é grande demais.');
  else if(c==='quota_exceeded') toast('Limite de armazenamento atingido. Exclua registros antigos.');
  else if(c==='sb') toast('Não foi possível salvar: '+(e.message||'erro no servidor'));
  else toast('Não foi possível salvar agora. Tente novamente.');
}

/* ---------- domain ---------- */
function statusPeriodo(inicio,fim,alerta){
  const t=today();
  if(!inicio||!fim) return {k:'encerrado',l:'Sem período'};
  if(t<inicio) return {k:'agendado',l:'Agendado'};
  if(t>fim) return {k:'encerrado',l:'Encerrado'};
  const r=diffDays(t,fim);
  if(r<=alerta) return {k:'alerta',l:r===0?'Termina hoje':'Termina em '+r+' dia'+(r>1?'s':'')};
  return {k:'ativo',l:'Ativo'};
}
const stOut=o=>statusPeriodo(o.inicio,o.fim,ALERTA_OUTDOOR);
const stRad=r=>statusPeriodo(r.inicio,r.fim,ALERTA_RADIO);
function pill(st){return '<span class="pill '+st.k+'">'+esc(st.l)+'</span>';}
function alertas(){
  const t=today(), a=[];
  S.data.outdoors.forEach(o=>{ if(o.fim&&o.fim>=t&&diffDays(t,o.fim)<=ALERTA_OUTDOOR) a.push({tipo:'outdoor',col:'outdoors',id:o.id,dias:diffDays(t,o.fim),titulo:(o.codigo?o.codigo+' · ':'')+(o.endereco||'Ponto de outdoor'),sub:'Bissemana termina em '+fmtD(o.fim)+(o.peca?' · '+o.peca:'')}); });
  S.data.radios.forEach(r=>{ if(r.fim&&r.fim>=t&&diffDays(t,r.fim)<=ALERTA_RADIO) a.push({tipo:'radio',col:'radios',id:r.id,dias:diffDays(t,r.fim),titulo:r.nome||'Rádio',sub:'Vigência termina em '+fmtD(r.fim)+(r.spot?' · '+r.spot:'')}); });
  return a.sort((x,y)=>x.dias-y.dias);
}
function veiculacoes(){
  const v=[];

    if(o.valor||o.inicio) v.push({tipo:'outdoor',valor:Number(o.valor)||0,campanhaId:o.campanhaId,inicio:o.inicio,fim:o.fim,nome:o.codigo||o.endereco,cidade:o.cidade,peca:o.peca});
    (o.historico||[]).forEach(h=>v.push({tipo:'outdoor',valor:Number(h.valor)||0,campanhaId:h.campanhaId,inicio:h.inicio,fim:h.fim,nome:o.codigo||o.endereco,cidade:o.cidade,peca:h.peca,hist:true}));
  });
  S.data.radios.forEach(r=>v.push({tipo:'radio',valor:Number(r.valor)||0,campanhaId:r.campanhaId,inicio:r.inicio,fim:r.fim,nome:r.nome,cidade:r.cidades,peca:r.spot}));
  S.data.posts.forEach(p=>{if(Number(p.valor)>0&&p.dataHora&&TIPOS[p.rede]){const d=p.dataHora.slice(0,10);v.push({tipo:p.rede,valor:Number(p.valor),campanhaId:p.campanhaId,inicio:d,fim:d,nome:TIPOS[p.rede].label+' · '+(p.formato||'post'),cidade:'',peca:(p.legenda||'').slice(0,60)});}});

/* ---------- tags PDGC ---------- */
const tagObj=id=>S.data.tags.find(t=>t.id===id);
function tagsDe(rec){const pr=(rec.tags||[]).filter(tagObj);const c=campanha(rec.campanhaId);const her=((c&&c.tags)||[]).filter(t=>tagObj(t)&&!pr.includes(t));return {proprias:pr,herdadas:her,todas:pr.concat(her)};}
function tagChips(rec,camp){const d=camp?{proprias:(rec.tags||[]).filter(tagObj),herdadas:[]}:tagsDe(rec);if(!d.proprias.length&&!d.herdadas.length) return '';
  return '<div class="tags">'+d.proprias.map(id=>{const t=tagObj(id);return '<span class="tagp" style="--t:'+esc(t.cor||'#94a3b8')+'">#'+esc(t.nome)+'</span>';}).join('')+d.herdadas.map(id=>{const t=tagObj(id);return '<span class="tagp herd" style="--t:'+esc(t.cor||'#94a3b8')+'" title="Herdada da campanha">#'+esc(t.nome)+'</span>';}).join('')+'</div>';}

}

  const porTipo={}; Object.keys(TIPOS).forEach(k=>porTipo[k]=0); v.forEach(x=>porTipo[x.tipo]+=x.valor);

  h+='</div><div class="two" style="margin-top:14px">';
  h+='<div class="card"><div class="card-h"><h3>Investimento por tipo de mídia</h3></div><div class="card-b bars">'+
    Object.keys(TIPOS).filter(k=>porTipo[k]>0||k==='outdoor'||k==='radio').map(k=>'<div class="bar"><div class="bl"><span class="tag"><i style="background:'+TIPOS[k].cor+'"></i>'+TIPOS[k].label+'</span><b>'+money(porTipo[k])+'</b></div><div class="track"><div class="fill" style="width:'+(porTipo[k]/maxT*100)+'%;background:'+TIPOS[k].cor+'"></div></div></div>').join('')+
    '<div class="small muted">Nas redes sociais, conta o valor investido em impulsionamento de cada post.</div></div></div>';
  h+='<div class="card"><div class="card-h"><h3>Investimento por campanha</h3><span class="small muted">barra = realizado · traço = verba prevista</span></div><div class="card-b bars">'+
    (camps.length?camps.slice(0,8).map(x=>'<div class="bar"><div class="bl"><span class="tag"><i style="background:'+esc(x.c.cor||'#94a3b8')+'"></i>'+esc(x.c.nome)+'</span><b>'+money(x.real)+(x.prev?' <span class="muted" style="font-weight:400">de '+money(x.prev)+'</span>':'')+'</b></div><div class="track"><div class="fill" style="width:'+(x.real/maxC*100)+'%;background:'+(x.prev&&x.real>x.prev?'var(--bad)':esc(x.c.cor||'#94a3b8'))+'"></div>'+(x.prev?'<div class="mark" style="left:calc('+(x.prev/maxC*100)+'% - 1px)"></div>':'')+'</div></div>').join(''):'<div class="empty">Nenhuma campanha cadastrada.</div>')+

function kpi(l,v,s){return '<div class="card kpi"><div class="l">'+esc(l)+'</div><div class="v">'+esc(v)+'</div><div class="s">'+esc(s)+'</div></div>';}

/* ---------- CALENDAR ---------- */
RENDER.calendario=function(){
  $('#topActions').innerHTML='<button class="btn pri" data-act="novo-escolha" data-day="'+today()+'">+ Nova mídia</button>';
  const c=S.cal, ref=parse(c.ref);
  let titulo;
  if(c.modo==='mes') titulo=MESES[ref.getMonth()]+' '+ref.getFullYear();
  else{ const s=new Date(ref);s.setDate(s.getDate()-s.getDay());const e=new Date(s);e.setDate(e.getDate()+6);titulo=s.getDate()+' '+MESES[s.getMonth()].slice(0,3)+' – '+e.getDate()+' '+MESES[e.getMonth()].slice(0,3)+' '+e.getFullYear();}
  const ev=eventos();
  let h='<div class="card"><div class="calbar"><div class="seg"><button data-cal="prev">‹</button><button data-cal="hoje">Hoje</button><button data-cal="next">›</button></div><h2>'+esc(titulo)+'</h2><span style="flex:1"></span><div class="seg"><button data-calmodo="mes" class="'+(c.modo==='mes'?'on':'')+'">Mês</button><button data-calmodo="semana" class="'+(c.modo==='semana'?'on':'')+'">Semana</button></div></div>';
  h+='<div class="filters">'+Object.keys(TIPOS).map(k=>'<button class="fchip'+(c.tipos.has(k)?'':' off')+'" data-ftipo="'+k+'"><i style="background:'+TIPOS[k].cor+'"></i>'+TIPOS[k].label+'</button>').join('')+
    '<span style="flex:1"></span><select class="inp" id="fCamp">'+optCamp().map(o=>'<option value="'+esc(o[0])+'"'+(o[0]===c.campanha?' selected':'')+'>'+esc(o[0]?o[1]:'Todas as campanhas')+'</option>').join('')+'</select><select class="inp" id="fTag"><option value="">Todas as tags</option>'+S.data.tags.map(t=>'<option value="'+esc(t.id)+'"'+(t.id===c.tag?' selected':'')+'>#'+esc(t.nome)+'</option>').join('')+'</select>'+(()=>{const jid=(c.etapa||'').split('|')[0], J=S.data.jornadas.find(j=>j.id===jid);return '<select class="inp" id="fJor"><option value="">Todas as jornadas</option>'+S.data.jornadas.map(j=>'<option value="'+esc(j.id)+'"'+(j.id===jid?' selected':'')+'>'+esc(j.nome)+'</option>').join('')+'</select>'+(J?'<select class="inp" id="fEtapa"><option value="'+esc(J.id)+'|*">Todas as etapas</option>'+(J.etapas||[]).map((e,i)=>'<option value="'+esc(J.id+'|'+e.id)+'"'+(c.etapa===J.id+'|'+e.id?' selected':'')+'>'+(i+1)+'. '+esc(e.nome)+'</option>').join('')+'</select>':'');})()+'<input class="inp" id="fCid" placeholder="Filtrar cidade" value="'+esc(c.cidade)+'"></div>';
  const t=today();
  if(c.modo==='mes'){
    const first=new Date(ref.getFullYear(),ref.getMonth(),1);
    const start=new Date(first);start.setDate(1-first.getDay());
    const last=new Date(ref.getFullYear(),ref.getMonth()+1,0);
    const cells=Math.ceil((first.getDay()+last.getDate())/7)*7;
    h+='<div class="dow">'+DOW.map(d=>'<div>'+d+'</div>').join('')+'</div><div class="month">';
    for(let i=0;i<cells;i++){
      const d=new Date(start);d.setDate(start.getDate()+i);const ds=ymd(d);
      const its=noDia(ev,ds);
      h+='<div class="cell'+(d.getMonth()!==ref.getMonth()?' out':'')+(ds===t?' today':'')+'" data-day="'+ds+'"><div class="cell-h"><span class="dn">'+d.getDate()+'</span><button class="add" data-add="'+ds+'" title="Adicionar mídia em '+fmtD(ds)+'">+</button></div>'+
        its.slice(0,3).map(e=>chip(e)).join('')+(its.length>3?'<div class="more">+'+(its.length-3)+' mais</div>':'')+'</div>';
    }
    h+='</div>';
  }else{
    const s=new Date(ref);s.setDate(s.getDate()-s.getDay());
    h+='<div class="week">';
    for(let i=0;i<7;i++){
      const d=new Date(s);d.setDate(s.getDate()+i);const ds=ymd(d);const its=noDia(ev,ds);
      h+='<div class="wcol'+(ds===t?' today':'')+'" data-day="'+ds+'"><div class="wh"><b>'+DOW[i]+' '+d.getDate()+'</b><button class="btn sm" data-add="'+ds+'">+</button></div>'+(its.length?its.map(e=>chip(e,true)).join(''):'<span class="small muted">—</span>')+'</div>';
    }
    h+='</div>';
  }
  h+='</div>';
  $('#view').innerHTML=h;
  $('#fCamp').onchange=e=>{S.cal.campanha=e.target.value;RENDER.calendario();};
  $('#fTag').onchange=e=>{S.cal.tag=e.target.value;RENDER.calendario();};
  $('#fJor').onchange=e=>{S.cal.etapa=e.target.value?e.target.value+'|*':'';RENDER.calendario();};
  if($('#fEtapa')) $('#fEtapa').onchange=e=>{S.cal.etapa=e.target.value;RENDER.calendario();};
  let tm;$('#fCid').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{S.cal.cidade=e.target.value;RENDER.calendario();const i=$('#fCid');i.focus();i.setSelectionRange(i.value.length,i.value.length);},350);};
};
function moverCal(dir){
  const r=parse(S.cal.ref);
  if(dir===0){S.cal.ref=today();}
  else if(S.cal.modo==='mes'){S.cal.ref=ymd(new Date(r.getFullYear(),r.getMonth()+dir,1));}
  else{r.setDate(r.getDate()+7*dir);S.cal.ref=ymd(r);}
  RENDER.calendario();
}

      (c.objetivo?'<div class="small" style="margin-top:8px">'+esc(c.objetivo.slice(0,140))+'</div>':'')+tagChips(c,true)+

      '<div class="meta"><span>▣ '+nO+' outdoor</span><span>◉ '+nR+' rádio</span><span>◎ '+nP+' posts</span><span>📎 '+(c.pecas||[]).length+((c.pecas||[]).length===1?' peça':' peças')+'</span></div>'+
      (imgs.length?'<div class="thumbs">'+imgs.map(f=>'<img src="'+blobUrl(f.id)+'" alt="">').join('')+'</div>':'')+
    '</div>';
  }).join('')+'</div>';
};

  const c=S.placa, {W,H}=dimsPlaca(), b=+c.sangria||0, mk=c.marcas?10:0, TW=W+2*b+2*mk, TH=H+2*b+2*mk, x0=mk+b, y0=mk+b;

  s+='<rect x="'+(tx-m*0.45)+'" y="'+(y0+m+logoH*0.05)+'" width="'+mn*0.004+'" height="'+logoH*0.9+'" fill="#C9D200"/>';

  s+='<text x="'+tx+'" y="'+(ty+fsS*1.9)+'" font-family="'+FONT+'" font-size="'+fsS+'" fill="#bfe3df">'+esc((c.subtitulo||'')+(c.mapa==='BR'?'':' – '+UFNOME[c.mapa]))+'</text>';
  // footer
  const fsF=mn*0.022, footY=y0+H-m*0.75;
  const footTxt=dest?('Inauguração – '+(dest.unidade||dest.nome)+(c.data?' – '+fmtD(c.data):'')):(c.data?'Inauguração – '+fmtD(c.data):'');
  if(footTxt) s+='<text x="'+(x0+m)+'" y="'+footY+'" font-family="'+FONT+'" font-weight="bold" font-size="'+fsF+'" fill="#C9D200">'+esc(footTxt)+'</text>';
  s+='<text x="'+(x0+W-m)+'" y="'+footY+'" text-anchor="end" font-family="'+FONT+'" font-size="'+fsF*0.85+'" fill="#bfe3df">'+un.length+' unidade'+(un.length===1?'':'s')+(c.mapa==='BR'?' em '+new Set(un.map(u=>u.uf)).size+' estados':'')+'</text>';
  // panel
  const px=x0+m, py=y0+m+logoH+m*0.7, pw=W-2*m, ph=footY-fsF*1.6-py;
  s+='<rect x="'+px+'" y="'+py+'" width="'+pw+'" height="'+ph+'" rx="'+m*0.35+'" fill="#ffffff"/>';

  const cols=c.orient==='v'?2:(c.mapa==='BR'?4:3), groups=c.mapa==='BR'?[...new Set(un.map(u=>u.uf))]:[c.mapa];

  const kx=Math.cos(((y0g+y1g)/2)*Math.PI/180), sc=zoom?Math.min(mapW/((x1g-x0g)*kx),mapH/(y1g-y0g)):Math.min(mapW*0.96/((x1g-x0g)*kx),mapH*0.96/(y1g-y0g));
  const offX=mapX+(mapW-(x1g-x0g)*kx*sc)/2, offY=mapY+(mapH-(y1g-y0g)*sc)/2;

    Object.keys(BR).forEach(uf=>{s+='<path d="'+pathR(BR[uf].r)+'" fill="'+(ufsCom.has(uf)?'#cfeeea':'#eef3f3')+'" stroke="#ffffff" stroke-width="'+(mn*0.0018)+'"/>';});
    Object.keys(BR).filter(uf=>ufsCom.has(uf)).forEach(uf=>{s+='<path d="'+pathR(BR[uf].r)+'" fill="none" stroke="#003641" stroke-width="'+(mn*0.0025)+'"/>';});
  }else{
    if(zoom) s+='<defs><clipPath id="clipMapa"><rect x="'+mapX+'" y="'+mapY+'" width="'+mapW+'" height="'+mapH+'" rx="'+m*0.2+'"/></clipPath></defs><g clip-path="url(#clipMapa)"><rect x="'+mapX+'" y="'+mapY+'" width="'+mapW+'" height="'+mapH+'" fill="#f6f9f9"/>';
    const G=GEO[c.mapa], comU={};un.forEach(u=>{if(u.muni) comU[u.muni]=u.tipo==='escritorio'&&comU[u.muni]!=='agencia'?'escritorio':'agencia';});
    G.municipios.forEach(mu=>{if(zoom&&(mu.c[0]<x0g-0.6||mu.c[0]>x1g+0.6||mu.c[1]<y0g-0.6||mu.c[1]>y1g+0.6)) return;const t=comU[mu.n];s+='<path d="'+pathR(mu.r)+'" fill="'+(t==='agencia'?'#9fe0d8':t==='escritorio'?'#c9c8ee':'#eef3f3')+'" stroke="#ffffff" stroke-width="'+(mn*0.0009)+'"/>';});

    if(zoom){G.municipios.forEach(mu=>{if(comU[mu.n]){const q=pr(mu.c[0],mu.c[1]);}});s+='</g>';}
  }

  const pts=un.map((u,i)=>{const q=pr(u.ll[0],u.ll[1]);return {u,i,ox:q[0],oy:q[1],x:q[0],y:q[1]};});
  if(c.mapa!=='BR'){const minD=rM*2.25;for(let it=0;it<300;it++){let mv=false;for(let a=0;a<pts.length;a++)for(let bq=a+1;bq<pts.length;bq++){const A=pts[a],B=pts[bq];let dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy);if(d<minD){if(d<0.01){dx=Math.cos(a+bq);dy=Math.sin(a+bq);d=1;}const k=(minD-d)/2/d;A.x-=dx*k;A.y-=dy*k;B.x+=dx*k;B.y+=dy*k;mv=true;}}if(!mv) break;}}
  pts.forEach(p=>{if(Math.hypot(p.x-p.ox,p.y-p.oy)>rM*0.6) s+='<line x1="'+p.ox.toFixed(2)+'" y1="'+p.oy.toFixed(2)+'" x2="'+p.x.toFixed(2)+'" y2="'+p.y.toFixed(2)+'" stroke="#003641" stroke-width="'+(mn*0.0012)+'"/><circle cx="'+p.ox.toFixed(2)+'" cy="'+p.oy.toFixed(2)+'" r="'+(rM*0.18)+'" fill="#003641"/>';});
  pts.forEach(p=>{const cor=p.u.tipo==='escritorio'?CE:CA, isD=dest&&p.u.id===dest.id;
    if(isD) s+='<circle cx="'+p.x.toFixed(2)+'" cy="'+p.y.toFixed(2)+'" r="'+(rM*1.75)+'" fill="#C9D200" opacity="0.55"/>';
    s+='<circle cx="'+p.x.toFixed(2)+'" cy="'+p.y.toFixed(2)+'" r="'+(isD?rM*1.2:rM)+'" fill="'+cor+'" stroke="#ffffff" stroke-width="'+(rM*0.16)+'"/>';
    if(c.mapa!=='BR') s+='<text x="'+p.x.toFixed(2)+'" y="'+(p.y+rM*0.36).toFixed(2)+'" text-anchor="middle" font-family="'+FONT+'" font-weight="bold" font-size="'+(rM*1.05)+'" fill="#ffffff">'+(p.i+1)+'</text>';

    pts.slice().sort((a,b)=>a.y-b.y).forEach(p=>{const w=p.u.nome.length*fsN*0.56,hh=fsN*1.1;

      let best=cand[0],bb=null;for(const cd of cand){const x0b=cd[2]==='start'?cd[0]:cd[2]==='end'?cd[0]-w:cd[0]-w/2;const box={x0:x0b,y0:cd[1]-hh*0.85,x1:x0b+w,y1:cd[1]+hh*0.2};if(!hit(box)){best=cd;bb=box;break;}}
      if(!bb){const x0b=best[0];bb={x0:x0b,y0:best[1]-hh*0.85,x1:x0b+w,y1:best[1]+hh*0.2};}boxes.push(bb);
      const t='font-family="'+FONT+'" font-weight="bold" font-size="'+fsN.toFixed(2)+'" text-anchor="'+best[2]+'"';
      s+='<text x="'+best[0].toFixed(2)+'" y="'+best[1].toFixed(2)+'" '+t+' fill="none" stroke="#ffffff" stroke-width="'+(rM*0.3).toFixed(2)+'" stroke-linejoin="round">'+esc(p.u.nome)+'</text><text x="'+best[0].toFixed(2)+'" y="'+best[1].toFixed(2)+'" '+t+' fill="#003641">'+esc(p.u.nome)+'</text>';});
  }
  if(c.mapa==='BR'){
    const ufsCom=[...new Set(un.map(u=>u.uf))];
    ufsCom.forEach(uf=>{const l=pts.filter(p=>p.u.uf===uf);const cx=l.reduce((a,p)=>a+p.x,0)/l.length, cy=l.reduce((a,p)=>a+p.y,0)/l.length;const fs=mn*0.02, bx=cx+mn*0.06, by=cy+(uf==='RN'?-mn*0.05:mn*0.02);const txt=UFNOME[uf]+': '+l.length+' unidade'+(l.length>1?'s':'');const tw=txt.length*fs*0.6+fs;
      s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+bx+'" y2="'+by+'" stroke="#003641" stroke-width="'+mn*0.0015+'"/><rect x="'+bx+'" y="'+(by-fs*1.1)+'" width="'+tw+'" height="'+fs*1.6+'" rx="'+fs*0.3+'" fill="#003641"/><text x="'+(bx+fs*0.5)+'" y="'+(by+fs*0.05)+'" font-family="'+FONT+'" font-weight="bold" font-size="'+fs+'" fill="#ffffff">'+esc(txt)+'</text>';});
  }

  s+='<rect x="'+(lgX-fsG*12.5)+'" y="'+(lgY-fsG*1.3)+'" width="'+(fsG*12.9)+'" height="'+(leg.length*fsG*1.7+fsG*0.5)+'" rx="'+fsG*0.4+'" fill="#ffffff" opacity="0.92"/>';
  leg.forEach((l,i)=>{const yy=lgY+i*fsG*1.7;s+='<circle cx="'+(lgX-fsG*0.5)+'" cy="'+(yy-fsG*0.35)+'" r="'+fsG*0.45+'" fill="'+l[0]+'"/><text x="'+(lgX-fsG*1.3)+'" y="'+yy+'" text-anchor="end" font-family="'+FONT+'" font-size="'+fsG+'" fill="#003641">'+l[1]+'</text>';});

    s+='<text x="'+(xx+fsL*1.25)+'" y="'+yy+'" font-family="'+FONT+'" font-size="'+fsL+'" fill="#003641"'+(isD?' font-weight="bold"':'')+'>'+(c.mapa==='BR'?'':idx+'. ')+esc(u.nome)+(c.mapa==='BR'?'':'')+(u.tipo==='escritorio'?' (escritório)':'')+(isD?' – nova unidade':'')+'</text>';});
  // crop marks
  if(c.marcas){const L=mk-2,sw=0.25;[[x0,y0],[x0+W,y0],[x0,y0+H],[x0+W,y0+H]].forEach(([cx,cy])=>{const hx=cx<TW/2?0:TW-L, vy=cy<TH/2?0:TH-L;s+='<line x1="'+hx+'" y1="'+cy+'" x2="'+(hx+L)+'" y2="'+cy+'" stroke="#000" stroke-width="'+sw+'"/><line x1="'+cx+'" y1="'+vy+'" x2="'+cx+'" y2="'+(vy+L)+'" stroke="#000" stroke-width="'+sw+'"/>';});}

RENDER.placa=()=>renderPlaca();
function renderPlaca(){

  const seg=(k,opts)=>'<div class="segw">'+opts.map(o=>'<button data-placa="'+k+':'+o[0]+'" class="'+(String(c[k])===String(o[0])?'on':'')+'">'+o[1]+'</button>').join('')+'</div>';

    '<div class="f"><label>Mapa</label>'+seg('mapa',[['MG','Minas Gerais'],['RN','Rio Grande do Norte'],['BR','Brasil']])+'</div>'+
    (c.mapa!=='BR'?'<div class="f"><label>Enquadramento</label>'+seg('enq',[['regiao','Região das unidades'],['estado','Estado inteiro']])+'</div>':'')+
    '<div class="f"><label>Tamanho</label><select class="inp" id="plTam">'+[['60x40','60 × 40 cm'],['90x60','90 × 60 cm'],['100x70','100 × 70 cm'],['120x80','120 × 80 cm'],['42x29.7','A3 · 42 × 29,7 cm'],['custom','Personalizado']].map(o=>'<option value="'+o[0]+'"'+(c.tam===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select>'+
      (c.tam==='custom'?'<div style="display:flex;gap:6px;margin-top:6px"><input class="inp" id="plCw" type="number" min="10" value="'+c.cw+'" placeholder="Largura (cm)"><input class="inp" id="plCh" type="number" min="10" value="'+c.ch+'" placeholder="Altura (cm)"></div>':'')+'</div>'+
    '<div class="f"><label>Orientação</label>'+seg('orient',[['h','Horizontal'],['v','Vertical']])+'</div>'+
    '<div class="f"><label>Sangria</label>'+seg('sangria',[[0,'Sem'],[3,'3 mm'],[5,'5 mm']])+'</div>'+
    '<label class="tchk" style="--t:#003641;align-self:flex-start"><input type="checkbox" id="plMarcas"'+(c.marcas?' checked':'')+'> Marcas de corte</label>'+
    '<div class="f"><label>Título</label><input class="inp" id="plTit" value="'+esc(c.titulo)+'"></div>'+
    '<div class="f"><label>Subtítulo</label><input class="inp" id="plSub" value="'+esc(c.subtitulo)+'"></div>'+
    '<div class="f"><label>Unidade inaugurada (destaque)</label><select class="inp" id="plDest"><option value="">— Nenhuma —</option>'+unM.map(u=>'<option value="'+esc(u.id)+'"'+(u.id===c.destaque?' selected':'')+'>'+esc(u.nome)+' – '+u.uf+(u.tipo==='escritorio'?' (escritório)':'')+'</option>').join('')+'</select></div>'+
    '<div class="f"><label>Data da inauguração</label><input class="inp" type="date" id="plData" value="'+esc(c.data)+'"></div>'+
    '<div class="small muted">Arquivo final: '+(W/10).toLocaleString('pt-BR')+' × '+(H/10).toLocaleString('pt-BR')+' cm'+(+c.sangria?' + '+c.sangria+' mm de sangria':'')+'. '+unM.length+' unidade(s) no mapa. Para mudar cidades ou o tipo (agência/escritório), edite as unidades no <a href="#mapa">Mapa de atuação</a>.</div>'+
    '<button class="btn" data-act="placa-todas">⬇ Baixar as 3 placas (PDF)</button>'+
  '</div><div class="placa-prev" id="plPrev">'+placaSVG(LOGO)+'</div></div>';

let LOGO_PNG=null;
async function logoPng(){if(LOGO_PNG) return LOGO_PNG;LOGO_PNG=await new Promise(res=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=2680;c.height=910;c.getContext('2d').drawImage(im,0,0,2680,910);res(c.toDataURL('image/png'));};im.onerror=()=>res(LOGO);im.src=LOGO;});return LOGO_PNG;}
async function salvarArquivo(nome,blob){
  if(MODO==='claude'){ if(!downloads) throw new Error('sem downloads'); await downloads.save({filename:nome,data:blob}); }
  else{ const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000); }
}
const nomePlaca=()=>{const c=S.placa,{W,H}=dimsPlaca();return 'placa-inauguracao-'+(c.mapa==='BR'?'brasil':c.mapa.toLowerCase())+'-'+(W/10)+'x'+(H/10)+'cm';};
async function pdfPlaca(){
  await carregarScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  await carregarScript('https://cdn.jsdelivr.net/npm/svg2pdf.js@2.9.0/dist/svg2pdf.umd.min.js');
  const png=await logoPng();
  const host=document.createElement('div');host.style.cssText='position:fixed;left:-30000px;top:0';host.innerHTML=placaSVG(png);document.body.appendChild(host);
  const el=host.querySelector('svg'), vb=el.viewBox.baseVal, TW=vb.width, TH=vb.height;
  const pdf=new window.jspdf.jsPDF({unit:'mm',format:[TW,TH],orientation:TW>TH?'landscape':'portrait',compress:true});
  await pdf.svg(el,{x:0,y:0,width:TW,height:TH});
  host.remove();
  return pdf.output('blob');

async function acaoPlaca(tipo,btn){
  const txt=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spin"></span> Gerando…';
  try{
    if(tipo==='svg'){await salvarArquivo(nomePlaca()+'.svg',new Blob([placaSVG(await logoPng())],{type:'image/svg+xml'}));}
    else if(tipo==='png'){const svg=placaSVG(await logoPng());const im=new Image();await new Promise((ok,er)=>{im.onload=ok;im.onerror=er;im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);});const vb=/viewBox="0 0 ([\d.]+) ([\d.]+)"/.exec(svg);const w=4000,hh=Math.round(w*(+vb[2])/(+vb[1]));const cv=document.createElement('canvas');cv.width=w;cv.height=hh;cv.getContext('2d').drawImage(im,0,0,w,hh);const blob=await new Promise(r=>cv.toBlob(r,'image/png'));await salvarArquivo(nomePlaca()+'.png',blob);}
    else if(tipo==='pdf'){await salvarArquivo(nomePlaca()+'.pdf',await pdfPlaca());}
    else if(tipo==='todas'){const orig=S.placa.mapa;for(const mp of ['MG','RN','BR']){S.placa.mapa=mp;const d=S.placa.destaque;await salvarArquivo(nomePlaca()+'.pdf',await pdfPlaca());S.placa.destaque=d;}S.placa.mapa=orig;}
    toast('Arquivo gerado.');

  btn.disabled=false;btn.innerHTML=txt;
}

function sobrepoe(a,b,ini,fim){if(!a) return 0;b=b||a;const s=a>ini?a:ini,e=b<fim?b:fim;return e>=s?diffDays(s,e)+1:0;}
function midiasDoMes(m){

function agregar(ps){
  const a={n:ps.length,impressions:0,reach:0,likes:0,comments:0,shares:0,saves:0,eng:0};
  ps.forEach(p=>{const m=p.m||{};a.impressions+=+m.impressions||0;a.reach+=+m.reach||0;a.likes+=+m.likes||0;a.comments+=+m.comments||0;a.shares+=+m.shares||0;a.saves+=+m.saves||0;a.eng+=+m.engagementRate||0;});
  a.eng=ps.length?a.eng/ps.length:0; return a;
}

function msgErroSocial(e){
  const c=e&&e.code;
  switch(c){
    case 'sb_func': return 'A função zernio não respondeu. Confira se ela foi publicada no Supabase e se a chave ZERNIO_API_KEY foi cadastrada.';
    case 'server_not_connected': return 'O conector <b>Zernio Instagram</b> não está adicionado na sua conta. Adicione em claude.ai → Configurações → Conectores e tente de novo.';
    case 'needs_reauth': return 'A conexão com o Zernio expirou. Reconecte em claude.ai → Configurações → Conectores.';
    case 'selection_required': return 'Há mais de um conector com esse nome. Escolha qual usar no aviso do claude.ai e tente de novo.';
    case 'approval_required': case 'consent_required': return 'O acesso ao Zernio precisa da sua aprovação. Clique em “Atualizar dados” e permita quando o claude.ai perguntar.';
    case 'not_in_manifest': return 'O acesso ao Zernio foi negado para esta página. Ative-o nas permissões do artefato e tente de novo.';
    case 'blocked_by_policy': return 'A política da sua organização bloqueia este conector.';
    case 'server_unavailable': return 'O Zernio não respondeu agora. Tente de novo em alguns instantes.';
    case 'tool_error': return 'O Zernio retornou um erro: '+esc((e.message||'').slice(0,200));
    default: return 'Não foi possível buscar os dados agora'+(c?' ('+esc(c)+')':'')+'.';
  }
}

function asObj(p){if(typeof p==='string'){try{return JSON.parse(p);}catch(_){return p;}}return p;}
function textoDe(r){if(!r) return '';if(r.payload!=null) return r.payload;return (r.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n');}
function lerContas(p){
  p=asObj(p);
  if(p&&typeof p==='object'){const arr=Array.isArray(p)?p:(p.accounts||p.data||[]);return arr.map(a=>({plataforma:String(a.platform||'').toLowerCase(),usuario:a.username||a.displayName||a.name||'',id:a._id||a.id||''}));}
  const out=[];String(p||'').split('\n').forEach(l=>{const m=l.match(/-\s*([\w-]+):\s*(.+?)\s*\(ID:\s*([^)]+)\)/);if(m) out.push({plataforma:m[1].toLowerCase(),usuario:m[2],id:m[3]});});
  return out;
}
function enxuto(x){
  const pl=(x.platforms&&x.platforms[0])||{}; const a=x.analytics||{};
  return {id:x._id||'',plataforma:String(x.platform||pl.platform||'').toLowerCase(),conta:pl.accountUsername||'',data:x.publishedAt||x.scheduledFor||'',url:x.platformPostUrl||pl.platformPostUrl||'',tipo:x.mediaType||'',conteudo:String(x.content||'').slice(0,220),
    m:{impressions:a.impressions||0,reach:a.reach||0,likes:a.likes||0,comments:a.comments||0,shares:a.shares||0,saves:a.saves||0,views:a.views||0,engagementRate:a.engagementRate||0}};
}
async function sincronizar(){
  if(!podeSocial()||S.syncing) return;
  S.syncing=true; S.socialErr=null; RENDER.integracoes();
  try{
    const dias=S.socialDias, from=addDays(today(),-dias);
    const contas=MODO==='supabase'?lerContas(await zernio({acao:'contas'})):lerContas(textoDe(await mcp.callTool(ZS,'accounts_list',{limit:100})));
    const posts=[];
    for(let page=1;page<=5;page++){
      const p=asObj(MODO==='supabase'?await zernio({acao:'analytics',page:page,fromDate:from}):textoDe(await mcp.callTool(ZS,'analytics_get_analytics',{limit:40,page:page,from_date:from,view:'summary'})))||{};
      (p.posts||[]).forEach(x=>posts.push(enxuto(x)));
      const pg=p.pagination; if(!pg||page>=(pg.pages||1)) break;
    }
    const snap={atualizadoEm:Date.now(),dias:dias,contas:contas,posts:posts.slice(0,200)};
    S.social=snap;
    if(MODO==='supabase'){ await sb.from('registros').upsert({colecao:'config',id:'social',dados:snap,atualizado_em:new Date().toISOString()},{onConflict:'colecao,id'}); }
    else if(db){ try{ await db.doc('config/social').set(snap); }catch(e){} }
    toast('Dados das redes sociais atualizados.');
  }catch(e){ S.socialErr=e||{}; }
  S.syncing=false; renderAll();
}

function novo(tipo,dia){
  const col=NOVO_MAP[tipo]; const pre={};
  if(col==='outdoors'&&dia){pre.inicio=dia;pre.fim=addDays(dia,13);}
  if(col==='radios'&&dia){pre.inicio=dia;}
  if(col==='posts'){pre.rede=tipo;pre.formato=FORMATOS[tipo][0];if(dia){pre.dataHora=dia+'T10:00';pre.status='agendado';}}
  if(col==='campanhas'&&dia){pre.inicio=dia;}
  abrirForm(col,null,pre);
}
function abrirForm(col,id,pre){
  const sch=SCHEMAS[col]; const rec=id?clone(get(col,id)):{};
  const vals={}; sch.fields.forEach(f=>{if(!f.k) return; if(f.t==='jornada'){vals.jornadaId=rec.jornadaId||'';vals.etapaId=rec.etapaId||'';return;} vals[f.k]=(rec[f.k]!==undefined?rec[f.k]:(f.t==='files'||f.t==='etapas'||f.t==='tags'?[]:(f.def||'')));});
  if(col==='jornadas'&&!id&&!(vals.etapas||[]).length) vals.etapas=[{id:uid(),nome:'',objetivo:''}];
  Object.assign(vals,pre||{});
  F={col,id,rec,vals,uploading:0};

  renderForm();
}

function fileChip(k,x,i){
  const u=blobUrl(x.id); const t=x.tipo||'';

  else if(/^video\//.test(t)) p='<video src="'+u+'" style="width:52px;height:52px;object-fit:cover;border-radius:5px" muted></video>';
  else p='📄';

}

function lerForm(){
  $$('#frm [data-k]').forEach(el=>{F.vals[el.dataset.k]=el.value;});

function aplicarShow(){
  $$('#frm [data-show]').forEach(el=>{const p=el.dataset.show.split('=');el.style.display=(String(F.vals[p[0]]||'')===p[1])?'':'none';});
}
function onFormInput(e){
  const k=e.target.dataset.k; if(!k) return;
  const old=F.vals[k]; F.vals[k]=e.target.value;
  if(k==='mapa'){const c=coordsDoLink(e.target.value);if(c){F.vals.lat=c.lat;F.vals.lng=c.lng;const a=$('#f_lat'),b=$('#f_lng');if(a) a.value=c.lat;if(b) b.value=c.lng;}}
  if(F.col==='outdoors'&&k==='inicio'&&e.target.value&&(!F.vals.fim||(old&&F.vals.fim===addDays(old,13)))){F.vals.fim=addDays(e.target.value,13);const fi=$('#f_fim');if(fi) fi.value=F.vals.fim;}
  aplicarShow();
}
function onFormChange(e){
  const el=e.target;
  if(el.dataset.k){
    F.vals[el.dataset.k]=el.value;
    if(el.dataset.k==='jornadaId'){lerForm();F.vals.etapaId='';renderForm();return;}
    if(F.col==='posts'&&el.dataset.k==='rede'){lerForm();F.vals.formato=FORMATOS[F.vals.rede][0];renderForm();return;}
    if(F.col==='campanhas'&&el.dataset.k==='cor'){const sw=$('.mh .sw');if(sw) sw.style.background=el.value;}
    aplicarShow();
  }
  if(el.dataset.file) enviarArquivos(el);
}
async function enviarArquivos(el){
  const k=el.dataset.file; const f=SCHEMAS[F.col].fields.find(x=>x.k===k);
  const files=Array.from(el.files||[]); if(!files.length||!podeEnviar()) return;
  const st=$('#upst'); F.uploading++; if(st) st.innerHTML='<span class="spin"></span> Enviando arquivo…';
  const formRef=F;
  for(const file of files){
    try{
      let item;
      if(MODO==='supabase'){
        const path=uid()+'-'+file.name.normalize('NFD').replace(/[^\w.\-]+/g,'_').slice(-80);
        const {error}=await sb.storage.from('midias').upload(path,file,{contentType:file.type||undefined});
        if(error) throw error;
        await assinar([path]);
        item={id:path,nome:file.name,tipo:file.type};
      }else{
        const r=await assets.upload(file);
        item={id:r.id,nome:file.name,tipo:r.contentType||file.type};
      }
      if(f.multi) formRef.vals[k]=(formRef.vals[k]||[]).concat([item]); else formRef.vals[k]=[item];
    }catch(err){ toast('Não foi possível enviar '+file.name+'. Verifique o tamanho (até 20 MB) e o tipo do arquivo.'); }
  }
  formRef.uploading--;
  if(F!==formRef) return;
  el.value='';
  const box=$('#files_'+k); if(box) box.innerHTML=(F.vals[k]||[]).map((x,i)=>fileChip(k,x,i)).join('');
  const st2=$('#upst'); if(st2) st2.textContent=F.uploading?'Enviando…':'';
}
async function salvarForm(){
  if(F.uploading){toast('Aguarde o envio dos arquivos terminar.');return;}
  lerForm();
  const sch=SCHEMAS[F.col];
  const falta=sch.fields.find(f=>f.req&&!String(F.vals[f.k]||'').trim());
  if(falta){toast('Preencha: '+falta.l);const el=$('#f_'+falta.k);if(el) el.focus();return;}
  if(F.vals.inicio&&F.vals.fim&&F.vals.fim<F.vals.inicio){toast('A data de fim é anterior ao início.');return;}
  const rec=Object.assign({},F.rec,F.vals); delete rec.jornada;
  if(F.col==='jornadas'){rec.etapas=(rec.etapas||[]).filter(e=>String(e.nome||'').trim()).map(e=>({id:e.id||uid(),nome:e.nome.trim(),objetivo:(e.objetivo||'').trim()}));if(!rec.etapas.length){toast('Cadastre pelo menos uma etapa.');return;}}
  if(rec.jornadaId&&!rec.etapaId){toast('Escolha a etapa da jornada.');return;}
  sch.fields.forEach(f=>{if(f.k&&(f.t==='number'||f.t==='money')) rec[f.k]=rec[f.k]===''||rec[f.k]==null?'':Number(rec[f.k]);});
  if(F.id) rec.id=F.id;
  const btn=$('[data-act="salvar"]'); if(btn){btn.disabled=true;btn.textContent='Salvando…';}
  try{ await salvar(F.col,rec); fecharModal(); toast('Salvo.'); }
  catch(e){ erroGravar(e); if(btn){btn.disabled=false;btn.textContent='Salvar';} }
}
async function novaVeiculacao(){

  novo.id=F.id;
  try{ await salvar('outdoors',novo); F.rec=clone(novo); delete F.rec.id; Object.keys(F.vals).forEach(k=>{if(k in novo) F.vals[k]=novo[k];}); renderForm(); toast('Veiculação anterior guardada no histórico. Preencha a nova.'); }

function fecharModal(){F=null;$('#modalRoot').innerHTML='';}
function confirmar(msg,ok){
  const root=document.createElement('div');
  root.innerHTML='<div class="mov" style="z-index:60"><div class="modal sm"><div class="mh"><h3>Confirmar</h3></div><div class="mb">'+esc(msg)+'</div><div class="mf"><button class="btn" data-c="0">Cancelar</button><button class="btn pri" data-c="1" style="background:var(--bad);border-color:var(--bad)">Excluir</button></div></div></div>';
  document.body.appendChild(root);
  root.addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b) return;root.remove();if(b.dataset.c==='1') ok();});
}
function escolherTipo(dia){
  const root=document.createElement('div'); root.id='chooser';
  root.innerHTML='<div class="mov" data-chooser-bg><div class="modal sm"><div class="mh"><h3>Nova mídia'+(dia?' · '+fmtD(dia):'')+'</h3><button class="x" data-c="x">×</button></div><div class="mb"><div class="addgrid">'+Object.keys(TIPOS).map(k=>'<button class="addbtn" style="--c:'+TIPOS[k].cor+'" data-c="'+k+'"><i></i>'+TIPOS[k].label+'</button>').join('')+'</div></div></div></div>';
  document.body.appendChild(root);
  root.addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(e.target.hasAttribute('data-chooser-bg')){root.remove();return;}if(!b) return;root.remove();if(b.dataset.c!=='x') novo(b.dataset.c,dia);});
}

/* ---------- export ---------- */
function csv(rows,cols){
  const q=v=>{v=v==null?'':String(v);return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  return '﻿'+[cols.map(c=>q(c[0])).join(';')].concat(rows.map(r=>cols.map(c=>q(c[1](r))).join(';'))).join('\r\n');
}
const brNum=n=>n===''||n==null?'':String(n).replace('.',',');
async function exportar(nome,texto){
  if(MODO!=='claude'){
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([texto],{type:'text/csv;charset=utf-8'}));a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);return;
  }
  if(downloads){
    try{ await downloads.save({filename:nome,data:new Blob([texto],{type:'text/csv;charset=utf-8'})}); return; }
    catch(e){ /* fall through to copy */ }
  }
  try{ await navigator.clipboard.writeText(texto.replace(/^﻿/,'')); toast('Dados copiados. Cole em uma planilha do Excel.'); }
  catch(e){ toast('Não foi possível exportar nesta visualização.'); }
}
function exportCol(col,rede){
  const d=today();
  if(col==='outdoors') return exportar('outdoor-'+d+'.csv',csv(S.data.outdoors,[['Código',r=>r.codigo],['Endereço',r=>r.endereco],['Cidade',r=>r.cidade],['Referência',r=>r.referencia],['Fornecedor',r=>r.fornecedor],['Campanha',r=>campNome(r.campanhaId)],['Peça',r=>r.peca],['Início',r=>fmtD(r.inicio)],['Fim',r=>fmtD(r.fim)],['Pagamento',r=>r.tipoValor==='contrato'?'Contrato':'Período'],['Nº contrato',r=>r.contratoNumero],['Valor (R$)',r=>brNum(r.valor)],['Status',r=>stOut(r).l]]));
  if(col==='radios') return exportar('radio-'+d+'.csv',csv(S.data.radios,[['Rádio',r=>r.nome],['Frequência',r=>r.frequencia],['Cidades',r=>cidadesDe(r.cidades).join(', ')],['Público estimado',r=>r.publico],['Campanha',r=>campNome(r.campanhaId)],['Spot',r=>r.spot],['Inserções/dia',r=>r.insercoes],['Horários',r=>r.horarios],['Início',r=>fmtD(r.inicio)],['Fim',r=>fmtD(r.fim)],['Pagamento',r=>r.tipoValor==='contrato'?'Contrato':'Período'],['Nº contrato',r=>r.contratoNumero],['Valor (R$)',r=>brNum(r.valor)],['Status',r=>stRad(r).l]]));
  if(col==='posts') return exportar('posts-'+(rede||'todos')+'-'+d+'.csv',csv(S.data.posts.filter(p=>!rede||p.rede===rede),[['Rede',r=>(TIPOS[r.rede]||{}).label],['Formato',r=>r.formato],['Data/hora',r=>fmtDT(r.dataHora)],['Status',r=>r.status],['Campanha',r=>campNome(r.campanhaId)],['Legenda',r=>r.legenda],['Hashtags',r=>r.hashtags],['Link',r=>r.link],['Investimento (R$)',r=>brNum(r.valor)],['Alcance',r=>r.alcance],['Impressões',r=>r.impressoes],['Curtidas',r=>r.curtidas],['Comentários',r=>r.comentarios],['Compartilhamentos',r=>r.compartilhamentos],['Salvamentos',r=>r.salvamentos]]));
  if(col==='campanhas'){const v=veiculacoes();return exportar('campanhas-'+d+'.csv',csv(S.data.campanhas,[['Campanha',r=>r.nome],['Início',r=>fmtD(r.inicio)],['Fim',r=>fmtD(r.fim)],['Verba prevista (R$)',r=>brNum(r.verba)],['Realizado (R$)',r=>brNum(v.filter(x=>x.campanhaId===r.id).reduce((s,x)=>s+x.valor,0))],['Outdoors',r=>S.data.outdoors.filter(o=>o.campanhaId===r.id).length],['Rádios',r=>S.data.radios.filter(o=>o.campanhaId===r.id).length],['Posts',r=>S.data.posts.filter(o=>o.campanhaId===r.id).length],['Objetivo',r=>r.objetivo]]));}
}
function exportGeral(){
  const rows=veiculacoes();
  exportar('relatorio-midias-'+today()+'.csv',csv(rows,[['Tipo',r=>TIPOS[r.tipo].label],['Mídia',r=>r.nome],['Cidade',r=>r.cidade],['Campanha',r=>campNome(r.campanhaId)],['Peça / spot',r=>r.peca],['Início',r=>fmtD(r.inicio)],['Fim',r=>fmtD(r.fim)],['Valor (R$)',r=>brNum(r.valor)],['Situação',r=>r.hist?'Histórico':statusPeriodo(r.inicio,r.fim,-1).l]]));
}

/* ---------- global click delegation ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('#modalRoot')){
    const a=t.closest('[data-act]');
    const ea=t.closest('[data-etadd]'), em=t.closest('[data-etmv]');
    if(ea){lerForm();F.vals.etapas=(F.vals.etapas||[]).concat([{id:uid(),nome:'',objetivo:''}]);renderForm();const ins=$$('#etapasEd [data-et=nome]');if(ins.length) ins[ins.length-1].focus();return;}
    if(em){lerForm();const [op,i]=em.dataset.etmv.split(':');const a=F.vals.etapas,k=+i;if(op==='rm') a.splice(k,1);else{const j=op==='up'?k-1:k+1;if(j>=0&&j<a.length){const x=a[k];a[k]=a[j];a[j]=x;}}renderForm();return;}
    const rm=t.closest('[data-rmfile]');
    if(rm){const p=rm.dataset.rmfile.split(':');lerForm();F.vals[p[0]]=(F.vals[p[0]]||[]).filter((_,i)=>i!==+p[1]);const box=$('#files_'+p[0]);if(box) box.innerHTML=F.vals[p[0]].map((x,i)=>fileChip(p[0],x,i)).join('');return;}
    if(!a){ if(t.classList.contains('mov')&&F) fecharModal(); return; }
    const act=a.dataset.act;
    if(act==='fechar-modal') fecharModal();
    else if(act==='salvar') salvarForm();
    else if(act==='nova-veic') novaVeiculacao();
    else if(act==='excluir'){const col=F.col,id=F.id;confirmar('Excluir este registro? Essa ação não pode ser desfeita.',async()=>{try{await excluir(col,id);fecharModal();toast('Excluído.');}catch(err){erroGravar(err);}});}
    return;
  }
  if(t.closest('#drawerRoot')){
    if(t.hasAttribute('data-close-drawer')){fecharDia();return;}
  }
  const open=t.closest('[data-open]');
  if(open){e.preventDefault();const p=open.dataset.open.split(':');abrirForm(p[0],p[1]);return;}
  const nv=t.closest('[data-novo]');
  if(nv){novo(nv.dataset.novo,nv.dataset.day||'');return;}
  const ad=t.closest('[data-add]');
  if(ad){e.stopPropagation();escolherTipo(ad.dataset.add);return;}
  if(t.closest('a.chip')) return;
  const more=t.closest('.more');
  const day=t.closest('[data-day]');
  if(day&&!t.closest('[data-act]')){abrirDia(day.dataset.day);return;}
  const cal=t.closest('[data-cal]');
  if(cal){moverCal(cal.dataset.cal==='prev'?-1:cal.dataset.cal==='next'?1:0);return;}
  const cm=t.closest('[data-calmodo]');
  if(cm){S.cal.modo=cm.dataset.calmodo;RENDER.calendario();return;}
  const ft=t.closest('[data-ftipo]');
  if(ft){const k=ft.dataset.ftipo;if(S.cal.tipos.has(k)) S.cal.tipos.delete(k); else S.cal.tipos.add(k);RENDER.calendario();return;}
  const fp=t.closest('[data-fpost]');
  if(fp){const p=fp.dataset.fpost.split(':');S.filtroStatus['posts-'+p[0]]=p[1];redeView(p[0]);return;}
  const mu=t.closest('[data-muni]');
  if(mu&&S.view==='mapa'){S.mapa.cidade=S.mapa.cidade===mu.dataset.muni?'':mu.dataset.muni;RENDER.mapa();return;}
  const pl=t.closest('[data-placa]');
  if(pl){const [k,v]=pl.dataset.placa.split(':');S.placa[k]=(k==='sangria')?+v:v;renderPlaca();return;}
  const me=t.closest('[data-mapenq]');
  if(me){S.mapa.enq=me.dataset.mapenq;RENDER.mapa();return;}
  const mf=t.closest('[data-mapuf]');
  if(mf){const u=mf.dataset.mapuf;if(S.mapa.ufs.has(u)) S.mapa.ufs.delete(u); else S.mapa.ufs.add(u);S.mapa.cidade='';RENDER.mapa();return;}
  const mt=t.closest('[data-maptipo]');
  if(mt){const k=mt.dataset.maptipo;if(S.mapa.tipos.has(k)) S.mapa.tipos.delete(k); else S.mapa.tipos.add(k);RENDER.mapa();return;}
  const jb=t.closest('[data-jor]');
  if(jb){S.jor.id=jb.dataset.jor;RENDER.jornadas();return;}
  const et=t.closest('[data-evtag]');
  if(et&&!t.closest('[data-open]')){S.ev.tag=et.dataset.evtag;RENDER.evidencias();return;}
  const dd=t.closest('[data-dias]');
  if(dd){S.socialDias=+dd.dataset.dias;RENDER.integracoes();return;}
  const a=t.closest('[data-act]');
  if(a){
    const act=a.dataset.act;
    if(act==='novo-escolha') escolherTipo(a.dataset.day||'');
    else if(act==='export') exportCol(a.dataset.col,a.dataset.rede);
    else if(act==='export-geral') exportGeral();
    else if(act==='sync') sincronizar();
    else if(act==='sair') sair();
    else if(act==='menu'){S.menu=!S.menu;renderSide();}
    else if(act==='exemplos') carregarExemplos();
    else if(act==='mapa-csv') exportMapa();
    else if(act==='placa-abrir'){S.placa.ativo=true;RENDER.mapa();window.scrollTo(0,0);}
    else if(act==='placa-fechar'){S.placa.ativo=false;renderAll();}
    else if(act==='placa-pdf') acaoPlaca('pdf',a);
    else if(act==='placa-svg') acaoPlaca('svg',a);
    else if(act==='placa-png') acaoPlaca('png',a);
    else if(act==='placa-todas') acaoPlaca('todas',a);
    else if(act==='mapa-limpa'){S.mapa.cidade='';RENDER.mapa();}
    else if(act==='obs-pdf') baixarObservatorio(a);
    else if(act==='ev-csv') exportEv();
    else if(act==='ev-ano'){const y=today().slice(0,4);S.ev.ini=y+'-01-01';S.ev.fim=y+'-12-31';RENDER.evidencias();}
    else if(act==='ev-pdf'){ let pr=document.getElementById('printRoot'); if(!pr){pr=document.createElement('div');pr.id='printRoot';document.body.appendChild(pr);} pr.innerHTML=docEvidencias(); try{ window.print(); }catch(e){ toast('Não foi possível abrir a impressão.'); } }
    else if(act==='rm-exemplos') confirmar('Remover todos os registros de exemplo?',removerExemplos);
    else if(act==='imprimir'){ let pr=document.getElementById('printRoot'); if(!pr){pr=document.createElement('div');pr.id='printRoot';document.body.appendChild(pr);} pr.innerHTML=$('.deck').innerHTML; try{ window.print(); }catch(e){ toast('Não foi possível abrir a impressão.'); } }
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const ch=$('#chooser');if(ch){ch.remove();return;}if(F){fecharModal();return;}if(S.drawerDay) fecharDia();}});

/* ---------- boot ---------- */
/* ---------- Supabase ---------- */
function aplicarLinha(r){
  if(r.colecao==='config'){ if(r.id==='social'){S.social=r.dados;} agendarRender(); return; }
  if(!S.data[r.colecao]) return;
  const obj=hidratar(Object.assign({},r.dados,{id:r.id}));
  const arr=S.data[r.colecao]; const i=arr.findIndex(x=>x.id===r.id);
  if(i>=0) arr[i]=obj; else arr.push(obj);
  assinar(idsDe(obj)); agendarRender();
}
function idsDe(o){const out=[];const walk=v=>{if(Array.isArray(v)) v.forEach(walk);else if(v&&typeof v==='object'){if(typeof v.id==='string'&&v.nome!==undefined&&!URLS[v.id]) out.push(v.id);Object.values(v).forEach(walk);}};walk(o);return out;}
async function assinar(ids){
  ids=Array.from(new Set(ids)).filter(x=>x&&!URLS[x]&&!String(x).startsWith('data:')); if(!ids.length) return;
  const {data}=await sb.storage.from('midias').createSignedUrls(ids,60*60*12);
  (data||[]).forEach(d=>{if(d.signedUrl) URLS[d.path]=d.signedUrl;});
  agendarRender();
}
function telaLogin(msg){
  $('#modalRoot').innerHTML='<div class="mov" style="background:var(--dark);align-items:center"><div class="modal sm"><div class="mh" style="background:var(--dark);border-radius:14px 14px 0 0;justify-content:center;padding:22px"><img src="'+LOGO+'" alt="Sicoob Credimepi" style="width:200px"></div><form class="mb" id="login" style="display:flex;flex-direction:column;gap:12px"><div><b style="font-size:16px">Gestão de Mídias</b><div class="small muted">Entre com seu e-mail e senha.</div></div><div class="f"><label>E-mail</label><input class="inp" type="email" name="email" required autocomplete="username"></div><div class="f"><label>Senha</label><input class="inp" type="password" name="senha" required autocomplete="current-password"></div>'+(msg?'<div class="small" style="color:var(--bad)">'+esc(msg)+'</div>':'')+'<button class="btn pri" type="submit" style="justify-content:center">Entrar</button></form></div></div>';
  $('#login').addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(e.target);const b=e.target.querySelector('button');b.disabled=true;b.textContent='Entrando…';
    const {error}=await sb.auth.signInWithPassword({email:fd.get('email'),password:fd.get('senha')});
    if(error) telaLogin(error.message==='Invalid login credentials'?'E-mail ou senha incorretos.':error.message);});
}
let sbIniciado=false;
async function iniciarSupabase(){
  if(sbIniciado) return; sbIniciado=true;
  $('#modalRoot').innerHTML='';
  S.store='carregando'; renderAll();
  const {data,error}=await sb.from('registros').select('colecao,id,dados').range(0,9999);
  if(error){S.store='erro';S.storeErr=error.message;renderBanner();return;}
  COLS.forEach(c=>S.data[c]=[]);
  (data||[]).forEach(r=>{ if(r.colecao==='config'){ if(r.id==='social') S.social=r.dados; } else if(S.data[r.colecao]) S.data[r.colecao].push(hidratar(Object.assign({},r.dados,{id:r.id}))); });
  S.store='ok'; renderAll();
  assinar(COLS.flatMap(c=>S.data[c].flatMap(idsDe)));
  sb.channel('registros').on('postgres_changes',{event:'*',schema:'public',table:'registros'},pl=>{
    if(pl.eventType==='DELETE'){const o=pl.old||{};if(S.data[o.colecao]){S.data[o.colecao]=S.data[o.colecao].filter(x=>x.id!==o.id);agendarRender();}}
    else aplicarLinha(pl.new);
  }).subscribe();
  setInterval(()=>{Object.keys(URLS).forEach(k=>delete URLS[k]);assinar(COLS.flatMap(c=>S.data[c].flatMap(idsDe)));},1000*60*60*10);
}
async function bootSupabase(){
  MODO='supabase';
  sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey);
  rota();
  const {data:{session}}=await sb.auth.getSession();
  if(session) iniciarSupabase(); else telaLogin();
  sb.auth.onAuthStateChange((ev,s)=>{ if(ev==='SIGNED_IN'&&s) iniciarSupabase(); if(ev==='SIGNED_OUT') location.reload(); });
}
async function sair(){ await sb.auth.signOut(); }

function semear(){ const ex=dadosExemplo(); COLS.forEach(c=>{ if(!S.data[c].length) S.data[c]=ex[c].map(r=>hidratar(Object.assign({},r))); }); }
async function boot(){
  if(CFG.supabaseUrl&&CFG.supabaseAnonKey&&window.supabase){ return bootSupabase(); }
  rota();
  let c=window.claude, n=0;
  while((!c||typeof c.use!=='function')&&n<40){await new Promise(r=>setTimeout(r,100));c=window.claude;n++;}
  if(!c||typeof c.use!=='function'){S.store='local';semear();renderAll();return;}
  const use=name=>c.use(name).catch(()=>null);
  const res=await Promise.all([use('db'),use('assets'),use('mcp'),use('downloads')]);
  db=res[0];assets=res[1];mcp=res[2];downloads=res[3];
  if(!db){S.store='local';semear();renderAll();return;}
  MODO='claude';
  S.store='carregando';
  const timer=setTimeout(()=>{if(S.store==='carregando'){S.store='lento';renderBanner();}},10000);
  COLS.forEach(col=>{
    db.collection(col).onSnapshot(snap=>{
      S.data[col]=snap.docs.map(d=>hidratar(Object.assign({},d.data(),{id:d.id})));
      S.loaded[col]=true;
      if(COLS.every(k=>S.loaded[k])&&(S.store==='carregando'||S.store==='lento')&&!snap.metadata.fromCache){clearTimeout(timer);S.store='ok';}
      agendarRender();
    },err=>{clearTimeout(timer);S.store='erro';S.storeErr=err&&err.code;renderBanner();});
  });
  db.doc('config/social').onSnapshot(s=>{if(s.exists){S.social=s.data();agendarRender();}},()=>{});
  renderAll();
}
boot();
})();
